plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'socrates.Socrates'
}

shadowJar {
    archiveBaseName = 'socrates'
    archiveClassifier = ''
    archiveVersion = ''
}
